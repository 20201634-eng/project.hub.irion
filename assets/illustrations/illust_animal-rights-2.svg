<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- 2차 동물권 프로젝트: 수제간식 만들기 -> 3D 강아지 뼈다귀 간식 -->
  <defs>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7E6"/>
      <stop offset="55%" stop-color="#F6E2B8"/>
      <stop offset="100%" stop-color="#E4C182"/>
    </linearGradient>
    <radialGradient id="boneShine" cx="32%" cy="24%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="200" cy="308" rx="132" ry="20" fill="#4A4358" opacity="0.12"/>

  <g transform="rotate(-18 200 200)">
    <rect x="72" y="164" width="256" height="72" rx="36" fill="url(#boneGrad)"/>

    <circle cx="72" cy="156" r="42" fill="url(#boneGrad)"/>
    <circle cx="72" cy="244" r="40" fill="url(#boneGrad)"/>
    <circle cx="328" cy="156" r="40" fill="url(#boneGrad)"/>
    <circle cx="328" cy="244" r="42" fill="url(#boneGrad)"/>

    <rect x="72" y="164" width="256" height="72" rx="36" fill="url(#boneShine)"/>
    <circle cx="72" cy="156" r="42" fill="url(#boneShine)"/>
    <circle cx="328" cy="244" r="42" fill="url(#boneShine)"/>

    <ellipse cx="150" cy="182" rx="44" ry="10" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <circle cx="286" cy="112" r="7" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="304" cy="98" r="5" fill="#FFFFFF" opacity="0.65"/>
  <path d="M118 300 q12 -16 24 0" stroke="#4A4358" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.2"/>
</svg>
