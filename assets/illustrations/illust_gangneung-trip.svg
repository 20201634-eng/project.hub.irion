      <stop offset="0%" stop-color="#DCEEFC"/>
      <stop offset="100%" stop-color="#AFD8F0"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFF3B0"/>
