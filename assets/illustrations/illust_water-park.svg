  <ellipse cx="200" cy="300" rx="118" ry="50" fill="#BFE0F5"/>
  <ellipse cx="200" cy="300" rx="66" ry="22" fill="#FBF7F1"/>
  <path d="M86 288 Q140 270 200 270 Q260 270 314 288" stroke="#FFFFFF" stroke-width="6" opacity="0.7" stroke-linecap="round" fill="none"/>
  <!-- 몸 (튜브에 걸쳐 늘어진 자세) -->
  <ellipse cx="205" cy="278" rx="80" ry="56" fill="#F5F7FB" stroke="#4A4358" stroke-width="4"/>
  <!-- 앞발 (튜브에 걸침) -->
  <ellipse cx="130" cy="300" rx="18" ry="13" fill="#F5F7FB" stroke="#4A4358" stroke-width="4"/>
  <ellipse cx="284" cy="300" rx="18" ry="13" fill="#F5F7FB" stroke="#4A4358" stroke-width="4"/>
  <!-- 꼬리 -->
  <path d="M290 292 C 330 280, 336 240, 312 216" stroke="#4A4358" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M290 292 C 330 280, 336 240, 312 216" stroke="#BFE0F5" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- 머리 -->
  <circle cx="203" cy="188" r="84" fill="#F5F7FB" stroke="#4A4358" stroke-width="4"/>
  <!-- 세모 귀 -->
  <path d="M136 132 L112 66 L174 110 Z" fill="#F5F7FB" stroke="#4A4358" stroke-width="4" stroke-linejoin="round"/>
  <path d="M142 124 L126 86 L166 110 Z" fill="#BFE0F5"/>
  <path d="M270 132 L294 66 L232 110 Z" fill="#F5F7FB" stroke="#4A4358" stroke-width="4" stroke-linejoin="round"/>
  <path d="M264 124 L280 86 L240 110 Z" fill="#BFE0F5"/>
  <!-- 주둥이 -->
  <ellipse cx="203" cy="212" rx="32" ry="20" fill="#FFFFFF" stroke="#4A4358" stroke-width="3.5"/>
  <path d="M203 200 L195 210 L211 210 Z" fill="#F2A0B8" stroke="#4A4358" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M203 217 Q197 222 189 220 M203 217 Q209 222 217 220" stroke="#4A4358" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- 수염 -->
  <path d="M126 205 L164 202 M126 217 L164 214 M280 205 L242 202 M280 217 L242 214" stroke="#4A4358" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 편안한 눈 -->
  <path d="M162 178 Q174 170 186 178" stroke="#4A4358" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M220 178 Q232 170 244 178" stroke="#4A4358" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- 물방울 튐 -->
  <path d="M76 240 C 82 250, 82 258, 76 262 C 70 258, 70 250, 76 240 Z" fill="#AFD8F0" stroke="#4A4358" stroke-width="2.5"/>
  <path d="M330 210 C 336 220, 336 228, 330 232 C 324 228, 324 220, 330 210 Z" fill="#AFD8F0" stroke="#4A4358" stroke-width="2.5"/>
  <!-- 볼 홍조 -->
  <ellipse cx="155" cy="206" rx="12" ry="8" fill="#F8C9DC" opacity="0.8"/>
  <ellipse cx="253" cy="206" rx="12" ry="8" fill="#F8C9DC" opacity="0.8"/>
</svg>
