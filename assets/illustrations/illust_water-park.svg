<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- 캐리비안 베이 & 워터파크: 고양이, 물놀이 튜브에 몸을 걸친 모습 -->
  <path d="M0 340 Q60 322 120 340 T240 340 T360 340 T400 340 L400 400 L0 400 Z" fill="#AFD8F0" opacity="0.5"/>
  <!-- 튜브 (도넛형, 비스듬) -->
