  <path d="M28 278 C 78 244, 122 244, 170 272 C 218 300, 260 300, 308 266" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.85"/>

  <circle cx="82" cy="264" r="5" fill="#FFFFFF" opacity="0.8"/>
