<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- MT 기획: 강아지, 신난 포즈로 앞발 번쩍 -->
  <ellipse cx="200" cy="300" rx="92" ry="78" fill="#F3DEC4" stroke="#4A4358" stroke-width="4"/>
  <!-- 왼팔 번쩍 -->
  <path d="M128 300 C 95 270, 80 210, 88 168" stroke="#4A4358" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M128 300 C 95 270, 80 210, 88 168" stroke="#F3DEC4" stroke-width="26" stroke-linecap="round" fill="none"/>
  <circle cx="87" cy="160" r="19" fill="#F3DEC4" stroke="#4A4358" stroke-width="4"/>
  <!-- 오른팔 번쩍 -->
  <path d="M272 300 C 305 270, 320 210, 312 168" stroke="#4A4358" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M272 300 C 305 270, 320 210, 312 168" stroke="#F3DEC4" stroke-width="26" stroke-linecap="round" fill="none"/>
  <circle cx="313" cy="160" r="19" fill="#F3DEC4" stroke="#4A4358" stroke-width="4"/>
  <!-- 다리 -->
  <ellipse cx="165" cy="368" rx="24" ry="16" fill="#DDB98E" stroke="#4A4358" stroke-width="4"/>
  <ellipse cx="235" cy="368" rx="24" ry="16" fill="#DDB98E" stroke="#4A4358" stroke-width="4"/>
  <!-- 목 리본 -->
  <path d="M162 240 Q200 262 238 240" stroke="#C9B6F0" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- 머리 -->
  <circle cx="200" cy="185" r="88" fill="#F3DEC4" stroke="#4A4358" stroke-width="4"/>
  <!-- 귀 (늘어진 강아지 귀) -->
  <path d="M118 150 C 78 165, 70 225, 108 250 C 128 262, 140 235, 132 205 C 128 185, 128 165, 118 150 Z" fill="#DDB98E" stroke="#4A4358" stroke-width="4"/>
  <path d="M282 150 C 322 165, 330 225, 292 250 C 272 262, 260 235, 268 205 C 272 185, 272 165, 282 150 Z" fill="#DDB98E" stroke="#4A4358" stroke-width="4"/>
  <!-- 주둥이 -->
  <ellipse cx="200" cy="208" rx="42" ry="30" fill="#FCF6EC" stroke="#4A4358" stroke-width="4"/>
  <ellipse cx="200" cy="196" rx="11" ry="8" fill="#4A4358"/>
  <!-- 웃는 입 + 혀 -->
  <path d="M178 216 Q200 232 222 216" stroke="#4A4358" stroke-width="4" stroke-linecap="round" fill="none"/>
  <ellipse cx="200" cy="226" rx="9" ry="12" fill="#F2A0B8"/>
  <!-- 신난(감은) 눈 ^ ^ -->
  <path d="M158 168 Q170 156 182 168" stroke="#4A4358" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M218 168 Q230 156 242 168" stroke="#4A4358" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- 볼 홍조 -->
  <ellipse cx="150" cy="196" rx="14" ry="9" fill="#F8C9DC" opacity="0.8"/>
  <ellipse cx="250" cy="196" rx="14" ry="9" fill="#F8C9DC" opacity="0.8"/>
  <!-- 땀방울 (밤샘 텐션) -->
  <path d="M262 130 C 268 140, 268 150, 262 154 C 256 150, 256 140, 262 130 Z" fill="#AFD8F0" stroke="#4A4358" stroke-width="3"/>
</svg>
