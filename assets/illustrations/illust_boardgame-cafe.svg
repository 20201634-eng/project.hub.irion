<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- 보드게임 카페: 3D 주사위 두 개 -->
  <defs>
    <linearGradient id="diceTopA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDE8FB"/>
    </linearGradient>
    <linearGradient id="diceSideA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9CBF7"/>
      <stop offset="100%" stop-color="#B39CE8"/>
    </linearGradient>
    <linearGradient id="diceFrontA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3EEFC"/>
      <stop offset="100%" stop-color="#D9CBF7"/>
    </linearGradient>
    <linearGradient id="diceTopB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4F1FB"/>
    </linearGradient>
    <linearGradient id="diceSideB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C7E0F5"/>
      <stop offset="100%" stop-color="#8FBCE6"/>
    </linearGradient>
    <linearGradient id="diceFrontB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBF5FC"/>
      <stop offset="100%" stop-color="#C7E0F5"/>
    </linearGradient>
  </defs>

  <ellipse cx="200" cy="332" rx="112" ry="16" fill="#4A4358" opacity="0.12"/>

  <!-- 뒤쪽 주사위 (하늘색) -->
  <g>
    <path d="M232 150 L296 116 L360 150 L360 226 L296 260 L232 226 Z" fill="url(#diceFrontB)"/>
    <path d="M232 150 L296 184 L296 260 L232 226 Z" fill="url(#diceSideB)"/>
    <path d="M296 184 L360 150 L360 226 L296 260 Z" fill="url(#diceSideB)" opacity="0.85"/>
    <path d="M232 150 L296 116 L360 150 L296 184 Z" fill="url(#diceTopB)"/>
    <circle cx="296" cy="150" r="7" fill="#5B7FB0"/>
  </g>

  <!-- 앞쪽 주사위 (보라) -->
  <g>
    <path d="M96 210 L176 168 L256 210 L256 300 L176 342 L96 300 Z" fill="url(#diceFrontA)"/>
    <path d="M96 210 L176 252 L176 342 L96 300 Z" fill="url(#diceSideA)"/>
    <path d="M176 252 L256 210 L256 300 L176 342 Z" fill="url(#diceSideA)" opacity="0.85"/>
    <path d="M96 210 L176 168 L256 210 L176 252 Z" fill="url(#diceTopA)"/>

    <circle cx="176" cy="210" r="9" fill="#7A5FC4"/>
    <circle cx="150" cy="198" r="9" fill="#7A5FC4"/>
    <circle cx="202" cy="198" r="9" fill="#7A5FC4"/>
    <circle cx="150" cy="222" r="9" fill="#7A5FC4"/>
    <circle cx="202" cy="222" r="9" fill="#7A5FC4"/>

    <circle cx="122" cy="256" r="8" fill="#6E56B8"/>
    <circle cx="130" cy="286" r="8" fill="#6E56B8"/>

    <circle cx="230" cy="256" r="8" fill="#6E56B8"/>
    <circle cx="222" cy="286" r="8" fill="#6E56B8"/>
  </g>

  <ellipse cx="140" cy="230" rx="16" ry="34" fill="#FFFFFF" opacity="0.25"/>
</svg>
